</style><header><h1><button id="home" aria-label="Esma'ül Hüsna, başa dön ve sayacı sıfırla">Esma'ül Hüsna</button></h1><div class="count" role="status">Açılan kart <b id="counter">0</b></div><div class="rule"><div class="fill"></div></div></header><main><div class="grid"><button class="card" aria-expanded="false"><span class="num">01</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الله</span><span class="name">Allah</span><div class="detail" hidden><strong>Yüce yaratıcının özel adı</strong><span>Bütün ilâhî sıfatları kendinde toplayan, ibadete lâyık tek varlığın özel adı.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">02</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرحمن</span><span class="name">Er-Rahmân</span><div class="detail" hidden><strong>Rahmeti her şeyi kuşatan</strong><span>Kullarını var eden, onlara iman ve ebedî mutluluk yolunu açan. Gazzâlî bu ismi Allah’a özgü rahmetle açıklar.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">03</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرحيم</span><span class="name">Er-Rahîm</span><div class="detail" hidden><strong>Çok merhamet eden</strong><span>İhtiyaç sahibinin iyiliğini dileyen ve ihtiyacını gideren. Rahmetinin sonucu, iyiliğin kuluna ulaşmasıdır.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">04</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الملك</span><span class="name">El-Melik</span><div class="detail" hidden><strong>Mülkün gerçek sahibi</strong><span>Hiçbir şeye muhtaç olmayan, her şeyin varlığı ve devamı kendisine bağlı olan mutlak hükümdar.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">05</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القدوس</span><span class="name">El-Kuddûs</span><div class="detail" hidden><strong>Her eksiklikten uzak olan</strong><span>Duyuların, hayalin ve insan aklının tasavvur edebileceği her türlü sınırlamadan uzak olan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">06</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">السلام</span><span class="name">Es-Selâm</span><div class="detail" hidden><strong>Esenliğin kaynağı</strong><span>Zâtı kusurdan, sıfatları eksiklikten, fiilleri kötülükten uzak olan; esenliğin kaynağı.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">07</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المؤمن</span><span class="name">El-Mü’min</span><div class="detail" hidden><strong>Güven veren</strong><span>Korkuyu giderecek sebepleri yaratan ve böylece güven veren.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">08</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المهيمن</span><span class="name">El-Müheymin</span><div class="detail" hidden><strong>Gözetip koruyan</strong><span>Yarattıklarının hâlini bilen, onları gözeten ve korumaya gücü yeten.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">09</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العزيز</span><span class="name">El-Azîz</span><div class="detail" hidden><strong>İzzet ve üstünlük sahibi</strong><span>Eşi bulunmayan, herkesin kendisine ihtiyaç duyduğu ve zâtını tam olarak kavramaya güç yetirilemeyen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">10</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الجبار</span><span class="name">El-Cebbâr</span><div class="detail" hidden><strong>İradesini gerçekleştiren</strong><span>İradesi her varlık üzerinde geçerli olan, kendisi hiçbir varlığın iradesine boyun eğmeyen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">11</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المتكبر</span><span class="name">El-Mütekebbir</span><div class="detail" hidden><strong>Gerçek büyüklüğün sahibi</strong><span>Gerçek büyüklüğün yalnız kendisine ait olduğunu bilen ve her şeyin üstünde olan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">12</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الخالق</span><span class="name">El-Hâlık</span><div class="detail" hidden><strong>Yaratan</strong><span>Yaratacağı şeyin ölçüsünü, özelliklerini ve düzenini belirleyen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">13</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">البارئ</span><span class="name">El-Bâri’</span><div class="detail" hidden><strong>Varlıkları meydana getiren</strong><span>Ölçüsünü belirlediği varlığı yokluktan varlığa çıkaran.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">14</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المصور</span><span class="name">El-Musavvir</span><div class="detail" hidden><strong>Şekil veren</strong><span>Var ettiği her şeye onu başkalarından ayıran biçimi ve özellikleri veren.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">15</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الغفار</span><span class="name">El-Gaffâr</span><div class="detail" hidden><strong>Çokça bağışlayan</strong><span>Kullarının kusurlarını örten ve günahları tekrarlandığında da bağışlayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">16</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القهار</span><span class="name">El-Kahhâr</span><div class="detail" hidden><strong>Her şeye galip gelen</strong><span>Bütün varlıkları kudretine boyun eğdiren, hükmüne karşı konulamayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">17</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الوهاب</span><span class="name">El-Vehhâb</span><div class="detail" hidden><strong>Karşılıksız ihsan eden</strong><span>Karşılık, övgü veya herhangi bir kazanç beklemeden ihsan eden.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">18</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرزاق</span><span class="name">Er-Rezzâk</span><div class="detail" hidden><strong>Rızık veren</strong><span>Rızkı da rızıklananı da yaratan; bedeni gıdayla, kalbi bilgiyle besleyen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">19</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الفتاح</span><span class="name">El-Fettâh</span><div class="detail" hidden><strong>Kapıları açan ve hükmeden</strong><span>Kapalı olanı açan, güçlükleri çözen ve kalbe bilginin yolunu açan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">20</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العليم</span><span class="name">El-Alîm</span><div class="detail" hidden><strong>Her şeyi bilen</strong><span>Varlıkların içini dışını, başlangıcını sonunu eksiksiz bilen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">21</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القابض</span><span class="name">El-Kâbıd</span><div class="detail" hidden><strong>Daraltan</strong><span>Canları alan, rızkı daraltan; kulun kalbinde kendi azametini hissetmekten doğan ürpertiyi meydana getiren.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">22</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الباسط</span><span class="name">El-Bâsıt</span><div class="detail" hidden><strong>Genişlik veren</strong><span>Hayat ve rızık veren, kalbe yakınlık ve ümit duyurarak ferahlık bahşeden.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">23</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الخافض</span><span class="name">El-Hâfıd</span><div class="detail" hidden><strong>Alçaltan</strong><span>Dilediğinin derecesini alçaltan; insanın hakikatten uzak düşmesi de bu alçalmanın bir yönüdür.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">24</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرافع</span><span class="name">Er-Râfi’</span><div class="detail" hidden><strong>Yükselten</strong><span>Kullarını kendisine yakınlaştırarak derecelerini yükselten.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">25</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المعز</span><span class="name">El-Muiz</span><div class="detail" hidden><strong>İzzet veren</strong><span>Gerçek izzeti veren; kulu açgözlülüğün ve başkalarına el açmanın esaretinden kurtaran.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">26</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المذل</span><span class="name">El-Müzil</span><div class="detail" hidden><strong>Zillete düşüren</strong><span>Dilediğini zillete düşüren. Gazzâlî, insanın tutkularına köle olmasını zilletin bir görünümü olarak anlatır.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">27</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">السميع</span><span class="name">Es-Semî’</span><div class="detail" hidden><strong>Her şeyi işiten</strong><span>Fısıltı dâhil hiçbir ses kendisine gizli kalmayan, işitmek için organa ihtiyaç duymayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">28</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">البصير</span><span class="name">El-Basîr</span><div class="detail" hidden><strong>Her şeyi gören</strong><span>En gizli ayrıntıları bile gören, görmek için göze veya ışığa ihtiyaç duymayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">29</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحكم</span><span class="name">El-Hakem</span><div class="detail" hidden><strong>Kesin hükmü veren</strong><span>Hakkında son sözü söyleyen, hükmünü kimsenin geri çeviremeyeceği mutlak hâkim.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">30</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العدل</span><span class="name">El-Adl</span><div class="detail" hidden><strong>Mutlak adalet sahibi</strong><span>Her şeyi yerli yerine koyan. Gazzâlî, yaratılıştaki ölçü ve düzeni bu ismin anlaşılmasına örnek verir.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">31</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">اللطيف</span><span class="name">El-Latîf</span><div class="detail" hidden><strong>İncelikleri bilen ve lütfeden</strong><span>Kulunun en ince ihtiyacını bilen ve ona iyiliği sezilmeyecek kadar ince yollarla ulaştıran.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">32</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الخبير</span><span class="name">El-Habîr</span><div class="detail" hidden><strong>Her şeyden haberdar olan</strong><span>Olayların iç yüzünü ve gönüllerde saklı olanı bilen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">33</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحليم</span><span class="name">El-Halîm</span><div class="detail" hidden><strong>Cezalandırmada acele etmeyen</strong><span>İsyanı bildiği ve cezaya gücü yettiği hâlde öfkeyle acele etmeyen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">34</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العظيم</span><span class="name">El-Azîm</span><div class="detail" hidden><strong>Azameti sonsuz olan</strong><span>Azameti aklın bütünüyle kavrayabileceği sınırın ötesinde olan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">35</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الغفور</span><span class="name">El-Gafûr</span><div class="detail" hidden><strong>Bağışlaması geniş olan</strong><span>Bağışlaması kapsamlı ve tam olan, kulun kusurlarını örten.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">36</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الشكور</span><span class="name">Eş-Şekûr</span><div class="detail" hidden><strong>İyiliğe bol karşılık veren</strong><span>Kısa bir ömürde yapılan az bir iyiliğe bile kat kat ve kalıcı karşılık veren.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">37</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العلي</span><span class="name">El-Aliyy</span><div class="detail" hidden><strong>Çok yüce olan</strong><span>Varlık ve kemal mertebesinde kendisinden üstünü düşünülemeyen.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">38</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الكبير</span><span class="name">El-Kebîr</span><div class="detail" hidden><strong>Mutlak büyüklük sahibi</strong><span>Varlığı ezelden ebede süren ve başka varlıkların var olmasını sağlayan gerçek büyüklük sahibi.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">39</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحفيظ</span><span class="name">El-Hafîz</span><div class="detail" hidden><strong>Koruyup gözeten</strong><span>Varlıkları yok olmaktan koruyan, birbirine zıt unsurları dengede tutan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">40</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المقيت</span><span class="name">El-Mukît</span><div class="detail" hidden><strong>Azık veren ve gözeten</strong><span>Her canlının gıdasını yaratıp ona ulaştıran; bedenin ve kalbin beslenmesini sağlayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">41</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحسيب</span><span class="name">El-Hasîb</span><div class="detail" hidden><strong>Kuluna yeten</strong><span>Kulu için yeterli olan. İhtiyaçları karşılayan bütün sebepler sonunda O’na dayanır.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">42</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الجليل</span><span class="name">El-Celîl</span><div class="detail" hidden><strong>Ululuk sahibi</strong><span>Kudret, hâkimiyet ve mutlak zenginlik gibi ululuk bildiren sıfatların sahibi.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">43</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الكريم</span><span class="name">El-Kerîm</span><div class="detail" hidden><strong>İkramı bol olan</strong><span>Gücü varken affeden, sözünü yerine getiren ve umulandan fazlasını veren.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">44</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرقيب</span><span class="name">Er-Rakîb</span><div class="detail" hidden><strong>Her an gözeten</strong><span>Gözetimi kesintiye uğramayan, hiçbir varlığın hâlini gözden kaçırmayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">45</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المجيب</span><span class="name">El-Mücîb</span><div class="detail" hidden><strong>Dualara karşılık veren</strong><span>İsteyene karşılık veren, kulunun ihtiyacını daha o istemeden bilen ve karşılayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">46</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الواسع</span><span class="name">El-Vâsi’</span><div class="detail" hidden><strong>Lütfu ve ilmi sınırsız olan</strong><span>Bilgisinin kuşattıklarına ve ihsan ettiklerine sınır konulamayan.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">47</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحكيم</span><span class="name">El-Hakîm</span><div class="detail" hidden><strong>Hikmet sahibi</strong><span>En yüce hakikatleri en yetkin bilgiyle bilen, işleri kusursuz bir düzenle gerçekleştiren.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">48</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الودود</span><span class="name">El-Vedûd</span><div class="detail" hidden><strong>Çok seven</strong><span>Yarattıkları için iyilik dileyen ve onlara iyilik eden. Bu sevgi, kulun sıkıntıya düşmesinden önce de vardır.</span></div></button>
<button class="card" aria-expanded="false"><span class="num">49</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المجيد</span><span class="name">El-Mecîd</span><div class="detail" hidden><strong>Şanı yüce olan</strong><span>Zâtının şerefini, fiillerinin güzelliğini ve ihsanının genişliğini kendinde toplayan.</span></div></button>

<aside class="source-note">“İmam Gazzâlî, el-Maksadü’l-esnâ” eserindeki verilerle oluşturulmuştur.</aside></div></main>
<script>
const cards=[...document.querySelectorAll('.card')],main=document.querySelector('main');let count=0;
function expand(card,open){card.setAttribute('aria-expanded',open);card.querySelector('.detail').hidden=!open;card.querySelector('.plus').textContent=open?'−':'+'}
function refresh(){document.querySelector('#counter').textContent=count;document.querySelector('.fill').style.width=100*cards.filter(c=>c.ariaExpanded==='true'||c.getAttribute('aria-expanded')==='true').length/cards.length+'%'}
cards.forEach(card=>card.onclick=()=>{const open=card.getAttribute('aria-expanded')==='false';expand(card,open);if(open)count++;refresh()});
document.querySelector('#home').onclick=()=>{cards.forEach(c=>expand(c,false));count=0;refresh();main.scrollTop=0};
</script></html>
