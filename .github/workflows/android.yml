name: Esma APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android uygulamasını derle
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: APK imzasını ve içeriğini doğrula
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Esma.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Esma.apk
          unzip -p Esma.apk assets/index.html | cmp - app/src/main/assets/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: Esma
          path: Esma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Esma-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
