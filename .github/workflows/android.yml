name: Esma APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK ile derle
        shell: bash
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/35.0.0"
          platform="$ANDROID_HOME/platforms/android-35/android.jar"
          src=app/src/main
          mkdir -p build/classes build/dex
          "$tools/aapt2" compile --dir "$src/res" -o build/res.zip
          sed 's/<manifest /<manifest package="tr.olgun.esma" /' "$src/AndroidManifest.xml" > build/AndroidManifest.xml
          "$tools/aapt2" link -o build/base.apk -I "$platform" --manifest build/AndroidManifest.xml \
            -A "$src/assets" --min-sdk-version 24 --target-sdk-version 34 --version-code 2 --version-name 1.1 build/res.zip
          javac --release 8 -cp "$platform" -d build/classes "$src/java/tr/olgun/esma/Main.java"
          "$tools/d8" --release --min-api 24 --lib "$platform" --output build/dex build/classes/tr/olgun/esma/Main.class
          (cd build/dex && zip -q -0 ../base.apk classes.dex)
          "$tools/zipalign" -f 4 build/base.apk build/Esma-unsigned.apk
      - name: Test APK’sını imzala ve doğrula
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Esma CI"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/debug.jks" --ks-pass pass:android --out Esma.apk build/Esma-unsigned.apk
          "$signer" verify --verbose Esma.apk
          unzip -p Esma.apk assets/index.html | cmp - app/src/main/assets/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: Esma
          path: Esma.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Esma-release-unsigned
          path: build/Esma-unsigned.apk
