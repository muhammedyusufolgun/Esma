</style><header><h1><button id="home" aria-label="Esma'ül Hüsna, başa dön ve sayacı sıfırla">Esma'ül Hüsna</button></h1><div class="count" role="status">Açılan kart <b id="counter">0</b></div><div class="rule"><div class="fill"></div></div></header><main><div class="grid"><button class="card" aria-expanded="false"><span class="num">01</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الله</span><span class="name">Allah</span><div class="detail" hidden><strong>Yüce yaratıcının özel adı</strong><span>Bütün güzel isimler O’nu tanıtır. Mümin, duasında bu adla Rabbine yönelir.</span></div></button><button class="card" aria-expanded="false"><span class="num">02</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرحمن</span><span class="name">Er-Rahmân</span><div class="detail" hidden><strong>Rahmeti her şeyi kuşatan</strong><span>Yeryüzündeki canlıların beslenip büyümesinde ve barınacak yer bulmasında O’nun merhametinin izleri görülür.</span></div></button><button class="card" aria-expanded="false"><span class="num">03</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرحيم</span><span class="name">Er-Rahîm</span><div class="detail" hidden><strong>Çok merhamet eden</strong><span>Kul, bağışlanma dilerken de bir sıkıntıdan kurtulmayı umarken de O’nun rahmetine sığınır.</span></div></button><button class="card" aria-expanded="false"><span class="num">04</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الملك</span><span class="name">El-Melik</span><div class="detail" hidden><strong>Mülkün gerçek sahibi</strong><span>İnsanların elindeki güç ve yetki geçicidir. Bütün varlıklar üzerindeki hüküm O’na aittir.</span></div></button><button class="card" aria-expanded="false"><span class="num">05</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القدوس</span><span class="name">El-Kuddûs</span><div class="detail" hidden><strong>Her eksiklikten uzak olan</strong><span>İnsan kendisini bilgi ve güç bakımından sınırlı bulur. Allah ise yarattıklarına özgü kusurlardan münezzehtir.</span></div></button><button class="card" aria-expanded="false"><span class="num">06</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">السلام</span><span class="name">Es-Selâm</span><div class="detail" hidden><strong>Esenliğin kaynağı</strong><span>Kullarına selâmet veren O’dur. Mümin, kendisi ve başkaları için esenlik dilerken O’na yönelir.</span></div></button><button class="card" aria-expanded="false"><span class="num">07</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المؤمن</span><span class="name">El-Mü’min</span><div class="detail" hidden><strong>Güven veren</strong><span>Korku içindeki kul O’na sığınır. Allah’ın vaadine duyulan güven, mümine ümit verir.</span></div></button><button class="card" aria-expanded="false"><span class="num">08</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المهيمن</span><span class="name">El-Müheymin</span><div class="detail" hidden><strong>Gözetip koruyan</strong><span>Hiçbir varlık O’nun gözetiminin dışında kalmaz. Gizli ve açık bütün hâller O’nun bilgisi içindedir.</span></div></button><button class="card" aria-expanded="false"><span class="num">09</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العزيز</span><span class="name">El-Azîz</span><div class="detail" hidden><strong>İzzet ve üstünlük sahibi</strong><span>Hiçbir güç O’nu yenemez. Şeref ve itibar isteyen kul, bunların asıl sahibine yönelir.</span></div></button><button class="card" aria-expanded="false"><span class="num">10</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الجبار</span><span class="name">El-Cebbâr</span><div class="detail" hidden><strong>İradesini gerçekleştiren</strong><span>Hiçbir engel O’nun hükmünü geçersiz kılamaz. Eksikleri giderme ve güçsüzü ayağa kaldırma kudreti de O’na aittir.</span></div></button><button class="card" aria-expanded="false"><span class="num">11</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المتكبر</span><span class="name">El-Mütekebbir</span><div class="detail" hidden><strong>Gerçek büyüklüğün sahibi</strong><span>Mutlak yücelik yalnız O’na yaraşır. Bu ismi düşünen insan kendi sınırlarını hatırlar.</span></div></button><button class="card" aria-expanded="false"><span class="num">12</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الخالق</span><span class="name">El-Hâlık</span><div class="detail" hidden><strong>Yaratan</strong><span>Varlıkların ölçüsünü belirleyen ve onları var eden O’dur. Her canlının yaratılışı O’nun kudretine işaret eder.</span></div></button><button class="card" aria-expanded="false"><span class="num">13</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">البارئ</span><span class="name">El-Bâri’</span><div class="detail" hidden><strong>Varlıkları meydana getiren</strong><span>Her canlıyı kendine özgü nitelikleriyle varlık alanına çıkarır.</span></div></button><button class="card" aria-expanded="false"><span class="num">14</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المصور</span><span class="name">El-Musavvir</span><div class="detail" hidden><strong>Şekil veren</strong><span>Yaprakların biçiminden insanların yüzlerine kadar varlıkların farklı suretleri O’nun yaratmasıyladır.</span></div></button><button class="card" aria-expanded="false"><span class="num">15</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الغفار</span><span class="name">El-Gaffâr</span><div class="detail" hidden><strong>Çokça bağışlayan</strong><span>Hatasını fark edip tekrar Rabbine dönen kul, O’nun affından ümidini kesmez.</span></div></button><button class="card" aria-expanded="false"><span class="num">16</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القهار</span><span class="name">El-Kahhâr</span><div class="detail" hidden><strong>Her şeye galip gelen</strong><span>En güçlü görünen varlık bile O’nun hükmüne bağlıdır. Hiçbir güç O’nun iradesine üstün gelemez.</span></div></button><button class="card" aria-expanded="false"><span class="num">17</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الوهاب</span><span class="name">El-Vehhâb</span><div class="detail" hidden><strong>Karşılıksız ihsan eden</strong><span>İnsan daha istemeyi öğrenmeden hayat ve sayısız imkânla donatılır. Bu armağanlar O’nun ihsanındandır.</span></div></button><button class="card" aria-expanded="false"><span class="num">18</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرزاق</span><span class="name">Er-Rezzâk</span><div class="detail" hidden><strong>Rızık veren</strong><span>Her canlının geçimini sağlayan imkânları yaratır. Kul çalışırken rızkın sahibini de hatırlar.</span></div></button><button class="card" aria-expanded="false"><span class="num">19</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الفتاح</span><span class="name">El-Fettâh</span><div class="detail" hidden><strong>Kapıları açan ve hükmeden</strong><span>Çözümsüz görünen işlere çıkış yolu açar. Kullarının arasındaki hükmü de hakkıyla verir.</span></div></button><button class="card" aria-expanded="false"><span class="num">20</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العليم</span><span class="name">El-Alîm</span><div class="detail" hidden><strong>Her şeyi bilen</strong><span>Geçmiş ve gelecek, söylenen söz ve gizlenen niyet O’nun bilgisi içindedir.</span></div></button><button class="card" aria-expanded="false"><span class="num">21</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القابض</span><span class="name">El-Kâbıd</span><div class="detail" hidden><strong>Daraltan</strong><span>Rızkı ve imkânları hikmetiyle sınırlar. Bu isim, genişlik veren Bâsıt ismiyle birlikte düşünülür.</span></div></button><button class="card" aria-expanded="false"><span class="num">22</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الباسط</span><span class="name">El-Bâsıt</span><div class="detail" hidden><strong>Genişlik veren</strong><span>Darlıktan sonra ferahlık, geçim sıkıntısından sonra bolluk vermek O’nun kudretindedir.</span></div></button><button class="card" aria-expanded="false"><span class="num">23</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الخافض</span><span class="name">El-Hâfıd</span><div class="detail" hidden><strong>Alçaltan</strong><span>Dünya hayatında erişilen makamlar kalıcı değildir. Allah dilediğinin derecesini hikmetiyle indirir.</span></div></button><button class="card" aria-expanded="false"><span class="num">24</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرافع</span><span class="name">Er-Râfi’</span><div class="detail" hidden><strong>Yükselten</strong><span>Kullarının derecelerini yüceltir. İnsanların gözünden uzak bir iyilik de O’nun katında değerlidir.</span></div></button><button class="card" aria-expanded="false"><span class="num">25</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المعز</span><span class="name">El-Muiz</span><div class="detail" hidden><strong>İzzet veren</strong><span>Dilediği kuluna şeref ve itibar kazandırır. Mümin onurlu bir hayat için O’ndan yardım ister.</span></div></button><button class="card" aria-expanded="false"><span class="num">26</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المذل</span><span class="name">El-Müzil</span><div class="detail" hidden><strong>Zillete düşüren</strong><span>Gücünü üstünlük taslamak için kullanan kimsenin itibarını gidermeye O’nun kudreti yeter.</span></div></button><button class="card" aria-expanded="false"><span class="num">27</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">السميع</span><span class="name">Es-Semî’</span><div class="detail" hidden><strong>Her şeyi işiten</strong><span>En hafif fısıltı bile O’na gizli kalmaz. Kul duasını yüksek sesle söylemeye ihtiyaç duymadan Rabbine yönelir.</span></div></button><button class="card" aria-expanded="false"><span class="num">28</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">البصير</span><span class="name">El-Basîr</span><div class="detail" hidden><strong>Her şeyi gören</strong><span>Karanlıkta yapılan bir iyilik de kimsenin görmediği bir haksızlık da O’nun görüşünden uzak kalmaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">29</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحكم</span><span class="name">El-Hakem</span><div class="detail" hidden><strong>Kesin hükmü veren</strong><span>Kulların anlaşmazlıklarında en doğru hüküm O’na aittir. Hiçbir delil ve hiçbir niyet O’na gizli kalmaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">30</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العدل</span><span class="name">El-Adl</span><div class="detail" hidden><strong>Mutlak adalet sahibi</strong><span>Allah kimseye zulmetmez. Kulun yaptığı en küçük iyilik bile O’nun katında kaybolmaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">31</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">اللطيف</span><span class="name">El-Latîf</span><div class="detail" hidden><strong>İncelikleri bilen ve lütfeden</strong><span>Kullarının en ince ihtiyaçlarını bilir. Bazen insanın farkına bile varmadığı yollarla ona iyilik ulaştırır.</span></div></button><button class="card" aria-expanded="false"><span class="num">32</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الخبير</span><span class="name">El-Habîr</span><div class="detail" hidden><strong>Her şeyden haberdar olan</strong><span>Olayların görünen yanını da ardındaki sebepleri de bilir. Hiçbir hâl O’ndan saklı kalmaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">33</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحليم</span><span class="name">El-Halîm</span><div class="detail" hidden><strong>Cezalandırmada acele etmeyen</strong><span>Hata eden insana dönüp davranışını düzeltmesi için mühlet verir.</span></div></button><button class="card" aria-expanded="false"><span class="num">34</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العظيم</span><span class="name">El-Azîm</span><div class="detail" hidden><strong>Azameti sonsuz olan</strong><span>O’nun büyüklüğü insanın bildiği ölçülerin ötesindedir. Kul ibadetinde bu yüceliği anar.</span></div></button><button class="card" aria-expanded="false"><span class="num">35</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الغفور</span><span class="name">El-Gafûr</span><div class="detail" hidden><strong>Bağışlaması geniş olan</strong><span>Günahı ne kadar ağır görünürse görünsün, insan tövbe ederek O’nun bağışlamasını dileyebilir.</span></div></button><button class="card" aria-expanded="false"><span class="num">36</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الشكور</span><span class="name">Eş-Şekûr</span><div class="detail" hidden><strong>İyiliğe bol karşılık veren</strong><span>İçtenlikle yapılmış küçük bir iyiliği dahi bilir ve onu bolca mükâfatlandırır.</span></div></button><button class="card" aria-expanded="false"><span class="num">37</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">العلي</span><span class="name">El-Aliyy</span><div class="detail" hidden><strong>Çok yüce olan</strong><span>O’nun yüceliği bir makamla ölçülemez. Yarattıklarının sınırları O’nu kuşatamaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">38</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الكبير</span><span class="name">El-Kebîr</span><div class="detail" hidden><strong>Mutlak büyüklük sahibi</strong><span>İnsan gözünde büyük olan her şey yaratılmıştır. Bütün varlıklar O’nun kudretine muhtaçtır.</span></div></button><button class="card" aria-expanded="false"><span class="num">39</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحفيظ</span><span class="name">El-Hafîz</span><div class="detail" hidden><strong>Koruyup gözeten</strong><span>Varlıkların düzenini korur. İnsan emniyetini sağlamak için tedbir alırken O’nun korumasını da diler.</span></div></button><button class="card" aria-expanded="false"><span class="num">40</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المقيت</span><span class="name">El-Mukît</span><div class="detail" hidden><strong>Azık veren ve gözeten</strong><span>Canlıların yaşamlarını sürdürebilmesi için gereken gıdayı ve gücü yaratır.</span></div></button><button class="card" aria-expanded="false"><span class="num">41</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الحسيب</span><span class="name">El-Hasîb</span><div class="detail" hidden><strong>Hesaba çeken ve kuluna yeten</strong><span>Her davranışın hesabını eksiksiz bilir. Kul ihtiyaçlarını arz ederken Rabbine güvenir.</span></div></button><button class="card" aria-expanded="false"><span class="num">42</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الجليل</span><span class="name">El-Celîl</span><div class="detail" hidden><strong>Ululuk sahibi</strong><span>Büyüklük ve heybet O’na aittir. Bu isim kulun Rabbine duyduğu saygıyı besler.</span></div></button><button class="card" aria-expanded="false"><span class="num">43</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الكريم</span><span class="name">El-Kerîm</span><div class="detail" hidden><strong>İkramı bol olan</strong><span>Nimetleri insanın talebini aşacak kadar geniştir. Kul bu ikramı şükürle karşılar.</span></div></button><button class="card" aria-expanded="false"><span class="num">44</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرقيب</span><span class="name">Er-Rakîb</span><div class="detail" hidden><strong>Her an gözeten</strong><span>İnsanın yalnız kaldığı anlar da O’nun bilgisi içindedir. Bu bilinç, emanete sadakat göstermeye çağırır.</span></div></button><button class="card" aria-expanded="false"><span class="num">45</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المجيب</span><span class="name">El-Mücîb</span><div class="detail" hidden><strong>Dualara karşılık veren</strong><span>Kendisine yönelenin dileğini bilir. Kul, nasıl karşılık bulacağını O’nun hikmetine bırakarak dua eder.</span></div></button><button class="card" aria-expanded="false"><span class="num">46</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الواسع</span><span class="name">El-Vâsi’</span><div class="detail" hidden><strong>Lütfu ve ilmi sınırsız olan</strong><span>Yaratılmışların çokluğu O’nun bilgisini ve merhametini tüketmez.</span></div></button><button class="card" aria-ex د</span><span class="name">Es-Samed</span><div class="detail" hidden><strong>Herkesin kendisine muhtaç olduğu</strong><span>Varlıklar ihtiyaçlarını karşılamak için O’na yönelir. Kendisi ise hiçbir şeye muhtaç değildir.</span></div></button><button class="card" aria-expanded="false"><span class="num">69</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">القادر</span><span class="name">El-Kâdir</span><div class="detail" hidden><strong>Her şeye gücü yeten</strong><span>İnsanın gücünün yetmediği şeyler O’nun için güç değildir.</span></div></button><button class="card" aria-expanded="false"><span class="num">70</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المقتدر</span><span class="name">El-Muktedir</span><div class="detail" hidden><strong>Kudreti tam olan</strong><span>Dilediğini gerçekleştirmek için bir araçtan veya yardımcıdan güç almaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">71</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المقدم</span><span class="name">El-Mukaddim</span><div class="detail" hidden><strong>Öne alan</strong><span>Dilediğine öncelik verir. Kulların elde ettiği fırsatların vakti de O’nun takdiri içindedir.</span></div></button><button class="card" aria-expanded="false"><span class="num">72</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المؤخر</span><span class="name">El-Muahhir</span><div class="detail" hidden><strong>Geriye bırakan</strong><span>Bir işin gerçekleşmesini hikmetiyle sonraya bırakabilir. İnsan beklerken sabır ve dua ile O’na yönelir.</span></div></button><button class="card" aria-expanded="false"><span class="num">73</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الأول</span><span class="name">El-Evvel</span><div class="detail" hidden><strong>Başlangıcı olmayan</strong><s ="ar">مالك الملك</span><span class="name">Mâlikü’l-Mülk</span><div class="detail" hidden><strong>Bütün mülkün sahibi</strong><span>İnsana emanet edilen mal, makam ve yetkinin asıl sahibi O’dur. Dilediğine verir ve dilediğinden alır.</span></div></button><button class="card" aria-expanded="false"><span class="num">85</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">ذو الجلال والإكرام</span><span class="name">Zü’l-Celâli ve’l-İkrâm</span><div class="detail" hidden><strong>Ululuk ve ikram sahibi</strong><span>Kul O’nun azameti karşısında saygı duyar, lütuf ve ikramı karşısında şükreder.</span></div></button><button class="card" aria-expanded="false"><span class="num">86</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المقسط</span><span class="name">El-Muksit</span><div class="detail" hidden><strong>Adaletle hükmeden</strong><span>Hak sahibinin hakkını bilir. O’nun hükmünde hiç kimse haksızlığa uğramaz.</span></div></button><button class="card" aria-expanded="false"><span class="num">87</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الجامع</span><span class="name">El-Câmi’</span><div class="detail" hidden><strong>Bir araya toplayan</strong><span>Dağılmış olanları bir araya getirmeye kadirdir. İnsanları hesap günü bir arada toplayacaktır.</span></div></button><button class="card" aria-expanded="false"><span class="num">88</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الغني</span><span class="name">El-Ganiyy</span><div class="detail" hidden><strong>Hiçbir şeye muhtaç olmayan</strong><span>Kulların ibadeti O’na bir kazanç sağlamaz. İnsan ibadetiyle kendi Rabbine olan ihtiyacını dile getirir.</span></div></button><button class="card" aria-expanded="false"><span class="num">89</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المغني</span><span class="name">El-Muğnî</span><div class="detail" hidden><strong>İhtiyacı gideren</strong><span>Dilediğine bolluk ve yeterlilik verir. Kul elindeki imkânın O’nun ihsanı olduğunu hatırlar.</span></div></button><button class="card" aria-expanded="false"><span class="num">90</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">المانع</span><span class="name">El-Mâni’</span><div class="detail" hidden><strong>Engel olan</strong><span>Bir şeyin gerçekleşmesine engel olmak O’nun kudretindedir. Kul zarardan korunmayı O’ndan diler.</span></div></button><button class="card" aria-expanded="false"><span class="num">91</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الضار</span><span class="name">Ed-Dârr</span><div class="detail" hidden><strong>Zararı yaratmaya kudreti olan</strong><span>Sıkıntı ve zorluk da O’nun hükmünün dışında değildir. Bu isim, fayda veren Nâfi’ ile birlikte anılır.</span></div></button><button class="card" aria-expanded="false"><span class="num">92</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">النافع</span><span class="name">En-Nâfi’</span><div class="detail" hidden><strong>Fayda veren</strong><span>Şifaya, geçime ve iyiliğe vesile olan sebepleri yaratır. Kul faydalı olanı O’ndan ister.</span></div></button><button class="card" aria-expanded="false"><span class="num">93</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">النور</span><span class="name">En-Nûr</span><div class="detail" hidden><strong>Aydınlatan</strong><span>Gökleri ve yeri aydınlatır. İnsanın hakikati tanımasına yol gösterir.</span></div></button><button class="card" aria-expanded="false"><span class="num">94</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الهادي</span><span class="name">El-Hâdî</span><div class="detail" hidden><strong>Doğru yolu gösteren</strong><span>Kullarına doğruyu tanıma imkânı verir ve peygamberleri aracılığıyla onlara yol gösterir.</span></div></button><button class="card" aria-expanded="false"><span class="num">95</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">البديع</span><span class="name">El-Bedî’</span><div class="detail" hidden><strong>Örneksiz yaratan</strong><span>Gökleri ve yeri önceden var olan bir modeli izlemeksizin yaratmıştır.</span></div></button><button class="card" aria-expanded="false"><span class="num">96</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الباقي</span><span class="name">El-Bâkî</span><div class="detail" hidden><strong>Varlığı sürekli olan</strong><span>Zaman geçtikçe yaratılmışlar değişir ve yok olur. Allah’ın varlığı sona ermez.</span></div></button><button class="card" aria-expanded="false"><span class="num">97</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الوارث</span><span class="name">El-Vâris</span><div class="detail" hidden><strong>Her şeyin gerçek sahibi olarak kalan</strong><span>İnsan elindeki mülkü bırakıp dünyadan ayrılır. Bütün mülkün kalıcı sahibi Allah’tır.</span></div></button><button class="card" aria-expanded="false"><span class="num">98</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الرشيد</span><span class="name">Er-Reşîd</span><div class="detail" hidden><strong>Doğruya yönelten</strong><span>O’nun hükmünde isabet ve hikmet vardır. Kul kararlarında doğruyu bulmak için O’ndan yardım ister.</span></div></button><button class="card" aria-expanded="false"><span class="num">99</span><span class="plus" aria-hidden="true">+</span><span class="arabic" dir="rtl" lang="ar">الصبور</span><span class="name">Es-Sabûr</span><div class="detail" hidden><strong>Cezalandırmada acele etmeyen</strong><span>İsyan karşısında hemen ceza vermeyip mühlet tanır. İnsan bu süreyi hatasını düzeltmek için değerlendirebilir.</span></div></button></div></main>
<script>
const cards=[...document.querySelectorAll('.card')],main=document.querySelector('main');let count=0;
function expand(card,open){card.setAttribute('aria-expanded',open);card.querySelector('.detail').hidden=!open;card.querySelector('.plus').textContent=open?'−':'+'}
function refresh(){document.querySelector('#counter').textContent=count;document.querySelector('.fill').style.width=100*cards.filter(c=>c.ariaExpanded==='true'||c.getAttribute('aria-expanded')==='true').length/cards.length+'%'}
cards.forEach(card=>card.onclick=()=>{const open=card.getAttribute('aria-expanded')==='false';expand(card,open);if(open)count++;refresh()});
document.querySelector('#home').onclick=()=>{cards.forEach(c=>expand(c,false));count=0;refresh();main.scrollTop=0};
</script></html>
